<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Slots</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="container">
    <aside class="sidebar">
        <div class="logo">Lab Booking Portal</div>
        <nav class="nav">
            <a href="dashboard.html">Dashboard</a>
            <a href="resources.html" class="active">Book Resource</a>
            <a href="history.html">Booking History</a>
            <a href="profile.html">Profile</a>
            <a href="login.html">Logout</a>
        </nav>
    </aside>

    <main class="main">
        <div class="topbar">
            <h2>Available Time Slots</h2>
        </div>

        <div class="card">
            <div class="slot">
                <span>08:00 AM - 09:00 AM</span>
                <span class="status available">Available</span>
            </div>

            <div class="slot">
                <span>09:15 AM - 10:15 AM</span>
                <span class="status available">Available</span>
            </div>

            <div class="slot">
                <span>10:30 AM - 11:30 AM</span>
                <span class="status booked">Booked</span>
            </div>

            <div class="slot">
                <span>11:45 AM - 12:45 PM</span>
                <span class="status available">Available</span>
            </div>

            <div class="slot">
                <span>02:00 PM - 03:00 PM</span>
                <span class="status pending">Pending</span>
            </div>

            <div style="margin-top:20px;">
                <a class="btn" href="booking.html">Book Selected Slot</a>
            </div>
        </div>
    </main>
</div>
<script src="../assets/js/app.js"></script>
</body>
</html>
