</head>
<body>
<div class="container">
    <aside class="sidebar">
        <div class="logo">Lab Booking Portal</div>
        <nav class="nav">
            <a href="dashboard.html">Dashboard</a>

                </tr>

                <tr>
                    <td>B002</td>
                    <td>407-B</td>
                    <td>10 August 2026</td>
                    <td>11:45 - 12:45</td>
                    <td><span class="status available">Approved</span></td>
                </tr>

                <tr>
                    <td>B003</td>
                    <td>408-A</td>
                    <td>05 August 2026</td>
                    <td>02:00 - 03:00</td>
                    <td><span class="status booked">Rejected</span></td>

            </table>

</div>
