<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Resource</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="container">
    <aside class="sidebar">
        <div class="logo">Lab Booking Portal</div>
        <nav class="nav">
            <a href="dashboard.html">Dashboard</a>
            <a href="resources.html" class="active">Book Resource</a>
            <a href="history.html">Booking History</a>
            <a href="profile.html">Profile</a>
            <a href="login.html">Logout</a>
        </nav>
    </aside>

    <main class="main">
        <div class="topbar">
            <h2>Book Resource</h2>
        </div>

        <div class="card">
            <form id="bookingForm">
                <div class="form-group">
                    <label>Resource</label>
                    <select required>
                        <option>Computer Lab A-101</option>
                        <option>Electronics Lab B-203</option>
                        <option>Classroom C-305</option>
                    </select>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" required>
                    </div>

                    <div class="form-group">
                        <label>Time Slot</label>
                        <select required>
                            <option>08:00 - 09:00</option>
                            <option>09:15 - 10:15</option>
                            <option>11:45 - 12:45</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Purpose</label>
                    <textarea placeholder="Enter purpose of booking" required></textarea>
                </div>

                <button type="submit" class="btn">Submit Booking</button>
                <a href="resources.html" class="btn btn-secondary" style="margin-left:10px;">Cancel</a>
            </form>
        </div>
    </main>
</div>
<script src="../assets/js/app.js"></script>
</body>
</html>
