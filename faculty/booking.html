<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Resource</title>
<link rel="stylesheet" href="../assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="container">
    <aside class="sidebar">
        <div class="logo">Lab Booking Portal</div>
        <nav class="nav">
            <a href="dashboard.html">Dashboard</a>
            <a href="resources.html" class="active">Book Resource</a>
            <a href="history.html">Booking History</a>
            <a href="profile.html">Profile</a>
            <a href="login.html">Logout</a>
        </nav>
    </aside>

    <main class="main">
        <div class="topbar">
            <h2>Book Resource</h2>
        </div>

        <div class="card">
            <form id="bookingForm">
                <div class="form-group">
                    <label>Resource</label>
                    <select id="resourceSelect" required>
                        <option value="">Loading resources...</option>
                    </select>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="bookingDate" required>
                    </div>

                    <div class="form-group">
                        <label>Time Slot</label>
                        <select id="timeSlotSelect" required>
                            <option value="08:00 - 09:00">08:00 - 09:00</option>
                            <option value="09:15 - 10:15">09:15 - 10:15</option>
                            <option value="10:30 - 11:30">10:30 - 11:30</option>
                            <option value="11:45 - 12:45">11:45 - 12:45</option>
                            <option value="13:00 - 14:00">13:00 - 14:00</option>
                            <option value="14:00 - 15:00">14:00 - 15:00</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Purpose</label>
                    <textarea id="purposeInput" placeholder="Enter purpose of booking" required></textarea>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label>Headcount (Optional)</label>
                        <input type="number" id="headcountInput" placeholder="Estimated number of people" min="1">
                    </div>

                    <div class="form-group">
                        <label>Priority Level</label>
                        <select id="prioritySelect">
                            <option value="1">Normal (1)</option>
                            <option value="2">High (2)</option>
                            <option value="3">Critical (3)</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn">Submit Booking</button>
                <a href="resources.html" class="btn btn-secondary" style="margin-left:10px;">Cancel</a>
            </form>
        </div>
    </main>
</div>
<script src="../assets/js/app.js"></script>
</body>
</html>
