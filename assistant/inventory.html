<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory</title>
    <link rel="stylesheet" href="../assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">🧪 Lab Assistant</div>

        <nav class="nav">
            <a href="dashboard.html">Dashboard</a>
            <a href="schedule.html">Schedule</a>
            <a href="requests.html">Requests</a>
            <a href="inventory.html" class="active">Inventory</a>
            <a href="profile.html">Profile</a>
            <a href="../login.html">Logout</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main">

        <div class="topbar">
            <h2>Inventory Management</h2>
            <button class="btn">+ Add Item</button>
        </div>

        <div class="card">

            <table>
                <thead>
                    <tr>
                        <th>Equipment</th>
                        <th>Quantity</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>Desktop Computers</td>
                        <td>40</td>
                        <td><span class="status available">Available</span></td>
                    </tr>

                    <tr>
                        <td>Projectors</td>
                        <td>5</td>
                        <td><span class="status available">Working</span></td>
                    </tr>

                    <tr>
                        <td>Ethernet Cables</td>
                        <td>30</td>
                        <td><span class="status available">Available</span></td>
                    </tr>

                    <tr>
                        <td>VR Headset</td>
                        <td>1</td>
                        <td><span class="status pending">Maintenance</span></td>
                    </tr>
                </tbody>
            </table>

        </div>

    </main>

</div>

<script src="../assets/js/app.js"></script>
</body>
</html>
