<!DOCTYPE html>
<html lang="en">
<head>

<body>

<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">🧪 Lab Assistant</div>

        <nav class="nav">

            <a href="schedule.html">Daily Schedule</a>
            <a href="requests.html" class="active">Requests</a>

                </tr>

                <tr>
                    <td>REQ102</td>

                    <td>Lab 408A</td>

                </tr>

                <tr>
                    <td>REQ103</td>
                    <td>Dr. Patel</td>
                    <td>Lab 409A</td>
                    <td>02:00 - 04:00</td>
                    <td><span class="status available">Approved</span></td>

</div>
