<!DOCTYPE html>
<html lang="en">
<head>

    <title>Lab Assistant Dashboard</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>

<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">
