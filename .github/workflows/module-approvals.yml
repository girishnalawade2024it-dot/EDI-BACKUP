# Module: Approvals
# Admin approval priority queue, deny, preempt, concurrent admins
# Runs only when this module's files (or shared backend files) change.
name: "Module: Approvals"

on:
  push:
    branches: [main]
    paths:
      - "backend/api/approvals.py"
      - "backend/services/approval_service.py"
      - "tests/modules/test_approvals.py"
      - "backend/main.py"
      - "backend/database/**"
      - "requirements*.txt"
      - "pytest.ini"
      - "tests/modules/conftest.py"
      - "tests/modules/helpers.py"
      - ".github/workflows/_module-tests.yml"
      - ".github/workflows/module-approvals.yml"
  pull_request:
    paths:
      - "backend/api/approvals.py"
      - "backend/services/approval_service.py"
      - "tests/modules/test_approvals.py"
      - "backend/main.py"
      - "backend/database/**"
      - "requirements*.txt"
      - "pytest.ini"
      - "tests/modules/conftest.py"
      - "tests/modules/helpers.py"
      - ".github/workflows/_module-tests.yml"
      - ".github/workflows/module-approvals.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: module-approvals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/_module-tests.yml
    with:
      module: Approvals
      tests: tests/modules/test_approvals.py
