# Module: Audit Logs
# Append-only audit trail and CSV export
# Runs only when this module's files (or shared backend files) change.
name: "Module: Audit Logs"

on:
  push:
    branches: [main]
    paths:
      - "backend/api/audit_logs.py"
      - "backend/services/audit_service.py"
      - "tests/modules/test_audit.py"
      - "backend/main.py"
      - "backend/database/**"
      - "requirements*.txt"
      - "pytest.ini"
      - "tests/modules/conftest.py"
      - "tests/modules/helpers.py"
      - ".github/workflows/_module-tests.yml"
      - ".github/workflows/module-audit.yml"
  pull_request:
    paths:
      - "backend/api/audit_logs.py"
      - "backend/services/audit_service.py"
      - "tests/modules/test_audit.py"
      - "backend/main.py"
      - "backend/database/**"
      - "requirements*.txt"
      - "pytest.ini"
      - "tests/modules/conftest.py"
      - "tests/modules/helpers.py"
      - ".github/workflows/_module-tests.yml"
      - ".github/workflows/module-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: module-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/_module-tests.yml
    with:
      module: Audit Logs
      tests: tests/modules/test_audit.py
