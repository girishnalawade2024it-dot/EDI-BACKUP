# Module: Database
# SQLite schema, seed data, constraints, indexes
# Runs only when this module's files (or shared backend files) change.
name: "Module: Database"

on:
  push:
    branches: [main]
    paths:
      - "backend/database/**"
      - "tests/modules/test_database.py"
      - "backend/main.py"
      - "requirements*.txt"
      - "pytest.ini"
      - "tests/modules/conftest.py"
      - "tests/modules/helpers.py"
      - ".github/workflows/_module-tests.yml"
      - ".github/workflows/module-database.yml"
  pull_request:
    paths:
      - "backend/database/**"
      - "tests/modules/test_database.py"
      - "backend/main.py"
      - "requirements*.txt"
      - "pytest.ini"
      - "tests/modules/conftest.py"
      - "tests/modules/helpers.py"
      - ".github/workflows/_module-tests.yml"
      - ".github/workflows/module-database.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: module-database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/_module-tests.yml
    with:
      module: Database
      tests: tests/modules/test_database.py
