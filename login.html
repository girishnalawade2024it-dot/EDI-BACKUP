<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Lab Booking Portal</title>
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<script src="assets/js/app.js"></script>
<script>
async function loginUser() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    if (!email || !password) {
        alert('Please enter both email and password.');
        return;
    }

    // Use the secure RPC function to authenticate
    const { data: userData, error } = await supabaseClient
        .rpc('authenticate_user', { p_email: email, p_password: password });

    if (error || !userData) {
        alert('Invalid email or password.');
        return;
    }

    const user = userData;
    localStorage.setItem('session_token', user.session_token);
    localStorage.setItem('user_id', user.user_id);
    localStorage.setItem('user_name', user.name);
    localStorage.setItem('role_id', user.role_id);
    
    // Role mapping: 1: Faculty, 2: Lab Assistant, 3: Admin
    if (user.role_id === 1) {
        window.location.href = 'faculty/dashboard.html';
    } else if (user.role_id === 2) {
        window.location.href = 'assistant/dashboard.html';
    } else if (user.role_id === 3) {
        window.location.href = 'admin/dashboard.html';
    }
}
</script>
<body>
<div class="login-page">
    <div class="login-left">
        <img src="https://images.unsplash.com/photo-1562774053-701939374585?q=80&w=1200&auto=format&fit=crop" alt="Campus">
        <h1>Lab & Classroom Booking Portal</h1>
        <p>Smartly book laboratories and classrooms with ease.</p>
    </div>

    <div class="login-right">
        <div class="login-box card">
            <h2>Welcome Back!</h2>
            <p style="margin-bottom:20px;color:#6b7280;">Sign in to continue</p>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password">
            </div>

            <button type="button" class="btn" style="width:100%;" onclick="loginUser()">
                Login
            </button>

            <p style="text-align:center;margin-top:16px;font-size:14px;">
                Don't have an account? <a href="#" style="color:#2563eb;">Register</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
