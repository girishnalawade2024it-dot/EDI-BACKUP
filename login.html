<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Lab Booking Portal</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<script>
function loginUser() {

    const role = document.getElementById('role').value;

    if (role === 'faculty') {
        window.location.href = 'faculty/dashboard.html';
    }
    else if (role === 'assistant') {
        window.location.href = 'assistant/dashboard.html';
    }
    else if (role === 'admin') {
        window.location.href = 'admin/dashboard.html';
    }
}
</script>
<body>
<div class="login-page">
    <div class="login-left">
        <img src="https://images.unsplash.com/photo-1562774053-701939374585?q=80&w=1200&auto=format&fit=crop" alt="Campus">
        <h1>Lab & Classroom Booking Portal</h1>
        <p>Smartly book laboratories and classrooms with ease.</p>
    </div>

    <div class="login-right">
        <div class="login-box card">
            <h2>Welcome Back!</h2>
            <p style="margin-bottom:20px;color:#6b7280;">Sign in to continue</p>

            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Enter your password">
            </div>

            <div class="form-group">
                <label>Login As</label>
                <select id="role">
                    <option value="faculty">Faculty</option>
                    <option value="assistant">Lab Assistant</option>
                    <option value="admin">Admin</option>
                </select>
            </div>

            <button type="button" class="btn" style="width:100%;" onclick="loginUser()">
                Login
            </button>

            <p style="text-align:center;margin-top:16px;font-size:14px;">
                Don't have an account? <a href="#" style="color:#2563eb;">Register</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
